# The checks AGENTS.md requires before a change is done: typecheck, unit tests and the production build,
# plus every migration applied to a fresh local Supabase and the pgTAP tests run against it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  database:
    name: Migrations and pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.1
      # Auth stays on: its migrations add auth.users columns the tests use (is_anonymous). Mailpit stays
      # off: no test sends email, and its port has been seen taken on GitHub's runners.
      - run: supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,postgres-meta,supavisor,mailpit
      - run: supabase test db
